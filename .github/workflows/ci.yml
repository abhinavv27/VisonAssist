name: CI / Build, Test & Integrity Check

on:
  push:
    branches:
      - main
      - abhinav
      - frontend
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - abhinav
      - frontend

# Cancel in-progress runs for the same PR/branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test & Integrity (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Python Syntax & Flake8 Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,build,dist
          # Warning level for complexity
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics --exclude=.venv,__pycache__,build,dist

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify End-to-End Pipeline Loop (Headless Mock Mode)
        run: |
          python -c "
          import time, threading
          from app import run_cli_loop
          from config import ProductMode
          print('Testing end-to-end perception and reasoning pipeline...')
          t = threading.Thread(target=run_cli_loop, args=(ProductMode.OBSTACLE_AWARENESS, True, True), daemon=True)
          t.start()
          time.sleep(3.0)
          print('Pipeline verified successfully with 0 errors!')
          "
